<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공장 시계</title>
<!-- 시계 · 공장별 현지 시각 (Tableau 웹 페이지 개체용, 데이터 연결 없음 · 브라우저 시각 기준 매초 갱신)
     주소 옵션: ?view=clock | zones | all(기본)   ?asof=2026-08-18 (데이터 기준일 — 있으면 시계 카드 아래 줄 표시)
     시간대는 IANA 이름이라 서머타임은 브라우저가 계산한다. -->
<style>
  :root { --panel:#FFFFFF; --ink:#0E2240; --muted:#5E7393; --line:#D5E2F1; --navy:#0B2A55; --navy-ink:#FFFFFF; --navy-muted:#A9C4E6; }
  html, body { margin:0; background:transparent; font-family:"Pretendard","Segoe UI","Malgun Gothic",sans-serif; color:var(--ink); }
  .wrap { display:grid; gap:10px; padding:0; }
  /* view=clock: 카드가 웹 개체 높이를 꽉 채움 — 개체가 카드보다 크면 아래가 투명(흰색)으로 보이던 문제 */
  html.v-clock, html.v-clock body, html.v-clock .wrap { height:100%; }
  html.v-clock .clk { box-sizing:border-box; height:100%; display:flex; flex-direction:column; }
  html.v-clock .clk .ds { margin-top:auto; }
  /* view=zones: 공장별 현지 시각 카드도 높이를 꽉 채우고, 행은 위아래로 고르게 */
  html.v-zones, html.v-zones body, html.v-zones .wrap { height:100%; }
  html.v-zones #cardZones { box-sizing:border-box; height:100%; display:flex; flex-direction:column; }
  html.v-zones .wz { flex:1; align-content:space-between; }
  .rc { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .rc h3 { margin:0 0 8px; font-size:12.5px; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
  .rc h3 small { font-weight:400; font-size:11px; }
  .clk { background:var(--navy); color:var(--navy-ink); border-color:var(--navy); }
  .clk .tm { font-size:34px; font-weight:700; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .clk .tm small { font-size:16px; opacity:.7; margin-left:2px; }
  .clk .dt { font-size:13px; color:var(--navy-muted); margin-top:4px; }
  .clk .ds { display:flex; justify-content:space-between; font-size:11.5px; color:var(--navy-muted); margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,.14); }
  .clk .ds b { color:var(--navy-ink); font-weight:600; }
  .wz { display:grid; gap:5px; }
  .wz div { display:grid; grid-template-columns:24px 1fr auto 16px; align-items:center; gap:6px; font-size:12.5px; }
  .wz .t { font-weight:700; font-variant-numeric:tabular-nums; }
  .wz .c small { color:var(--muted); font-size:11px; margin-left:4px; }
  .wz .dn { font-size:12px; text-align:center; }
  .flag { display:block; width:24px; height:16px; border-radius:2px; overflow:hidden; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="flag-KR" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#CD2E3A"/><path d="M10,10 A5,5 0 0 0 20,10 A2.5,2.5 0 0 0 15,10 A2.5,2.5 0 0 1 10,10Z" fill="#0047A0"/><g transform="translate(7.1 4.73) rotate(-56.3)"><rect x="-2.2" y="-1.55" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="-0.35" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="0.85" width="4.4" height="0.7" fill="#000"/></g><g transform="translate(22.9 4.73) rotate(56.3)"><rect x="-2.2" y="-1.55" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="-0.35" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="0.85" width="4.4" height="0.7" fill="#000"/></g><g transform="translate(7.1 15.27) rotate(56.3)"><rect x="-2.2" y="-1.55" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="-0.35" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="0.85" width="4.4" height="0.7" fill="#000"/></g><g transform="translate(22.9 15.27) rotate(-56.3)"><rect x="-2.2" y="-1.55" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="-0.35" width="4.4" height="0.7" fill="#000"/><rect x="-2.2" y="0.85" width="4.4" height="0.7" fill="#000"/></g><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol><symbol id="flag-US" viewBox="0 0 30 20"><rect y="0.000" width="30" height="1.538" fill="#B22234"/><rect y="1.538" width="30" height="1.538" fill="#fff"/><rect y="3.077" width="30" height="1.538" fill="#B22234"/><rect y="4.615" width="30" height="1.538" fill="#fff"/><rect y="6.154" width="30" height="1.538" fill="#B22234"/><rect y="7.692" width="30" height="1.538" fill="#fff"/><rect y="9.231" width="30" height="1.538" fill="#B22234"/><rect y="10.769" width="30" height="1.538" fill="#fff"/><rect y="12.308" width="30" height="1.538" fill="#B22234"/><rect y="13.846" width="30" height="1.538" fill="#fff"/><rect y="15.385" width="30" height="1.538" fill="#B22234"/><rect y="16.923" width="30" height="1.538" fill="#fff"/><rect y="18.462" width="30" height="1.538" fill="#B22234"/><rect width="12" height="10.77" fill="#3C3B6E"/><circle cx="1.40" cy="1.40" r="0.45" fill="#fff"/><circle cx="3.70" cy="1.40" r="0.45" fill="#fff"/><circle cx="6.00" cy="1.40" r="0.45" fill="#fff"/><circle cx="8.30" cy="1.40" r="0.45" fill="#fff"/><circle cx="10.60" cy="1.40" r="0.45" fill="#fff"/><circle cx="1.40" cy="4.00" r="0.45" fill="#fff"/><circle cx="3.70" cy="4.00" r="0.45" fill="#fff"/><circle cx="6.00" cy="4.00" r="0.45" fill="#fff"/><circle cx="8.30" cy="4.00" r="0.45" fill="#fff"/><circle cx="10.60" cy="4.00" r="0.45" fill="#fff"/><circle cx="1.40" cy="6.60" r="0.45" fill="#fff"/><circle cx="3.70" cy="6.60" r="0.45" fill="#fff"/><circle cx="6.00" cy="6.60" r="0.45" fill="#fff"/><circle cx="8.30" cy="6.60" r="0.45" fill="#fff"/><circle cx="10.60" cy="6.60" r="0.45" fill="#fff"/><circle cx="1.40" cy="9.20" r="0.45" fill="#fff"/><circle cx="3.70" cy="9.20" r="0.45" fill="#fff"/><circle cx="6.00" cy="9.20" r="0.45" fill="#fff"/><circle cx="8.30" cy="9.20" r="0.45" fill="#fff"/><circle cx="10.60" cy="9.20" r="0.45" fill="#fff"/><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol><symbol id="flag-MX" viewBox="0 0 30 20"><rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#CE1126"/><circle cx="15" cy="10" r="2.6" fill="#8C5B2B"/><path d="M12.6,11.2 Q15,13.6 17.4,11.2" fill="none" stroke="#2E7D32" stroke-width=".6"/><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol><symbol id="flag-BR" viewBox="0 0 30 20"><rect width="30" height="20" fill="#009C3B"/><polygon points="15,2.2 27.4,10 15,17.8 2.6,10" fill="#FFDF00"/><circle cx="15" cy="10" r="4.4" fill="#002776"/><path d="M10.8,9.2 Q15,8 19.2,10.4" fill="none" stroke="#fff" stroke-width=".7"/><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol><symbol id="flag-PL" viewBox="0 0 30 20"><rect width="30" height="10" fill="#fff"/><rect y="10" width="30" height="10" fill="#DC143C"/><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol><symbol id="flag-CN" viewBox="0 0 30 20"><rect width="30" height="20" fill="#DE2910"/><polygon points="5.00,2.00 5.67,4.07 7.85,4.07 6.09,5.35 6.76,7.43 5.00,6.15 3.24,7.43 3.91,5.35 2.15,4.07 4.33,4.07" fill="#FFDE00"/><polygon points="10.39,1.08 10.33,1.80 11.00,2.09 10.29,2.25 10.22,2.97 9.85,2.35 9.14,2.52 9.62,1.97 9.25,1.34 9.91,1.63" fill="#FFDE00"/><polygon points="12.71,3.29 12.38,3.94 12.89,4.45 12.17,4.34 11.84,4.99 11.73,4.27 11.01,4.16 11.66,3.83 11.55,3.11 12.06,3.62" fill="#FFDE00"/><polygon points="12.00,6.00 12.22,6.69 12.95,6.69 12.36,7.12 12.59,7.81 12.00,7.38 11.41,7.81 11.64,7.12 11.05,6.69 11.78,6.69" fill="#FFDE00"/><polygon points="10.39,8.08 10.33,8.80 11.00,9.09 10.29,9.25 10.22,9.97 9.85,9.35 9.14,9.52 9.62,8.97 9.25,8.34 9.91,8.63" fill="#FFDE00"/><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol><symbol id="flag-IN" viewBox="0 0 30 20"><rect width="30" height="6.67" fill="#FF9933"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#138808"/><circle cx="15" cy="10" r="2.4" fill="none" stroke="#000080" stroke-width=".5"/><circle cx="15" cy="10" r=".5" fill="#000080"/><rect x=".25" y=".25" width="29.5" height="19.5" fill="none" stroke="rgba(0,0,0,.18)" stroke-width=".5"/></symbol></defs></svg>
<div class="wrap">
  <div class="rc clk" id="cardClock"><div class="tm" id="tm"></div><div class="dt" id="dt"></div>
    <div class="ds" id="ds"><span>데이터 기준 <b id="asof"></b></span><span id="ago"></span></div></div>
  <div class="rc" id="cardZones"><h3>공장별 현지 시각<small>한국 시간 대비</small></h3><div class="wz" id="wz"></div></div>
</div>
<script>
  const Z = [['KR','Asia/Seoul','한국'],['US','America/Chicago','미국'],['MX','America/Mexico_City','멕시코'],['BR','America/Sao_Paulo','브라질'],['PL','Europe/Warsaw','폴란드'],['CN','Asia/Shanghai','중국'],['IN','Asia/Kolkata','인도']];
  const q = new URLSearchParams(location.search), view = q.get('view') || 'all', asof = q.get('asof');
  if (view === 'zones') document.getElementById('cardClock').remove();
  if (view === 'clock') document.getElementById('cardZones').remove();
  document.documentElement.classList.add('v-' + view);
  if (!asof && document.getElementById('ds')) document.getElementById('ds').remove();
  const parts = (tz, now) => Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(now).map(x => [x.type, x.value]));
  const utc = o => Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour % 24, +o.minute);
  const pad = n => String(n).padStart(2, '0');
  const wz = document.getElementById('wz');
  function buildZones(now) {
    if (!wz) return;
    const kst = parts('Asia/Seoul', now);
    wz.innerHTML = Z.map(([k, tz, n]) => {
      const off = Math.round((utc(parts(tz, now)) - utc(kst)) / 36e5 * 2) / 2;   // 0.5시간 단위(인도 -3.5h)
      return `<div data-tz="${tz}"><svg class="flag" viewBox="0 0 30 20"><use href="#flag-${k}"/></svg>`
        + `<span class="c">${n}<small>${off === 0 ? '기준' : (off > 0 ? '+' : '') + off + 'h'}</small></span><span class="t"></span><span class="dn"></span></div>`;
    }).join('');
  }
  let lastHour = -1;
  function tick() {
    const now = new Date(), k = parts('Asia/Seoul', now);   // 상단 시계는 한국 시각(시청 PC 시간대와 무관)
    const tm = document.getElementById('tm');
    if (tm) {
      tm.innerHTML = `${pad(+k.hour % 24)}:${k.minute}<small>:${k.second}</small>`;
      document.getElementById('dt').textContent = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }).format(now);
      if (asof) {
        const [y, m, d] = asof.split('-').map(Number), ago = Math.floor((Date.UTC(+k.year, +k.month - 1, +k.day) - Date.UTC(y, m - 1, d)) / 864e5);
        document.getElementById('asof').textContent = asof;
        document.getElementById('ago').textContent = ago <= 0 ? '오늘 데이터' : `${ago}일 전 데이터`;
      }
    }
    if (+k.hour !== lastHour) { buildZones(now); lastHour = +k.hour; }   // 시차는 서머타임 전환 때만 바뀌므로 매시 다시 계산
    if (wz) wz.querySelectorAll('[data-tz]').forEach(el => {
      const o = parts(el.dataset.tz, now), h = +o.hour % 24;
      el.querySelector('.t').textContent = `${pad(h)}:${o.minute}`;
      el.querySelector('.dn').textContent = h >= 6 && h < 18 ? '☀' : '☾';
    });
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
